name: Engines

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.27.2'

jobs:
  engines:
    name: Engine (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [gin, stdlib, fiber]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Generate, build, test, and verify code generation
        run: go run ./pkg/tools/verifyengines -engine=${{ matrix.engine }} -output="$RUNNER_TEMP/gobase-engines"
      - name: Lint generated project
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: ${{ runner.temp }}/gobase-engines/${{ matrix.engine }}
      - name: Scan generated project
        working-directory: ${{ runner.temp }}/gobase-engines/${{ matrix.engine }}
        run: go tool govulncheck ./...
      - name: Verify Asynq failure and recovery with real Redis
        working-directory: ${{ runner.temp }}/gobase-engines/${{ matrix.engine }}
        env:
          ASYNQ_TEST_REDIS_ADDR: localhost:6379
        run: go test -count=1 -race -timeout=4m -v ./config ./integration-test/asynq
      - name: Build and start app
        working-directory: ${{ runner.temp }}/gobase-engines/${{ matrix.engine }}
        env:
          APP_ENV: development
          HTTP_PORT: '8080'
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DBNAME: test_db
          POSTGRES_SSLMODE: disable
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
          ASYNQ_MAX_RETRY: '1'
          ASYNQ_JOB_TIMEOUT: '2s'
          JWT_SECRET_KEY: integration-test-secret-key
          STORAGE_DRIVER: local
          STORAGE_LOCAL_PATH: /tmp/uploads
          STORAGE_LOCAL_URL: http://localhost:8080/uploads
          WEBSOCKET_ENABLED: 'true'
          WEBSOCKET_ALLOWED_ORIGINS: https://example.com
        run: |
          go build -o ./bin/app ./cmd/app
          mkdir -p /tmp/uploads
          (
            ./bin/app &
            app_pid=$!
            echo "$app_pid" > "$RUNNER_TEMP/app.pid"
            status=0
            wait "$app_pid" || status=$?
            echo "$status" > "$RUNNER_TEMP/app.exit"
          ) > "$RUNNER_TEMP/app.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/readyz > /dev/null; then
              exit 0
            fi
            if [ -f "$RUNNER_TEMP/app.pid" ] && ! kill -0 "$(cat "$RUNNER_TEMP/app.pid")" 2>/dev/null; then
              cat "$RUNNER_TEMP/app.log"
              exit 1
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/app.log"
          exit 1
      - name: Run integration tests
        working-directory: ${{ runner.temp }}/gobase-engines/${{ matrix.engine }}
        env:
          APP_HOST: localhost
          APP_PORT: '8080'
          TEST_ASYNQ_REDIS_ADDR: localhost:6379
          TEST_ASYNQ_MAX_RETRY: '1'
          TEST_ASYNQ_JOB_TIMEOUT: '2s'
        run: go test -count=1 -v ./integration-test/... -run 'TestHTTP(Register|Login|GetCurrentUser|RefreshToken|Logout|Unauthorized|CRUD|GeneratedCRUD)V1'
      - name: Verify native gRPC alongside HTTP
        working-directory: ${{ runner.temp }}/gobase-engines/${{ matrix.engine }}
        env:
          GRPC_ENABLED: 'true'
          GRPC_INSECURE: 'true'
          GRPC_ADDRESS: 127.0.0.1:50051
          JWT_SECRET_KEY: integration-test-secret-key
        run: |
          go build -o ./bin/grpc ./cmd/grpc
          (
            ./bin/grpc &
            grpc_pid=$!
            echo "$grpc_pid" > "$RUNNER_TEMP/grpc.pid"
            status=0
            wait "$grpc_pid" || status=$?
            echo "$status" > "$RUNNER_TEMP/grpc.exit"
          ) > "$RUNNER_TEMP/grpc.log" 2>&1 &
          go run ./integration-test/grpccheck -insecure
          kill -TERM "$(cat "$RUNNER_TEMP/grpc.pid")"
          for attempt in $(seq 1 20); do
            if [ -f "$RUNNER_TEMP/grpc.exit" ]; then break; fi
            sleep 1
          done
          test "$(cat "$RUNNER_TEMP/grpc.exit")" = 0
          curl -fsS http://localhost:8080/readyz
          echo 'gRPC stopped independently; HTTP remains ready'
      - name: Verify native WebSocket and active shutdown
        working-directory: ${{ runner.temp }}/gobase-engines/${{ matrix.engine }}
        run: |
          go build -o "$RUNNER_TEMP/websocket-check" ./integration-test/websocketcheck
          "$RUNNER_TEMP/websocket-check" -wait-shutdown > "$RUNNER_TEMP/websocket-native.log" 2>&1 &
          client_pid=$!
          trap 'kill "$client_pid" 2>/dev/null || true; cat "$RUNNER_TEMP/websocket-native.log"' EXIT
          connected=false
          for attempt in $(seq 1 10); do
            if grep -q 'WebSocket connected' "$RUNNER_TEMP/websocket-native.log"; then connected=true; break; fi
            kill -0 "$client_pid"
            sleep 1
          done
          test "$connected" = true
          kill -TERM "$(cat "$RUNNER_TEMP/app.pid")"
          wait "$client_pid"
          grep -q 'WebSocket shutdown verified' "$RUNNER_TEMP/websocket-native.log"
          for attempt in $(seq 1 20); do
            if [ -f "$RUNNER_TEMP/app.exit" ]; then break; fi
            sleep 1
          done
          test "$(cat "$RUNNER_TEMP/app.exit")" = 0
      - name: Build and verify Docker app and worker
        working-directory: ${{ runner.temp }}/gobase-engines/${{ matrix.engine }}
        run: |
          app_name="gobase-${{ matrix.engine }}-smoke-app"
          worker_name="gobase-${{ matrix.engine }}-smoke-worker"
          grpc_name="gobase-${{ matrix.engine }}-smoke-grpc"
          upload_volume="gobase-${{ matrix.engine }}-smoke-uploads"
          client_pid=''
          cleanup() {
            if [ -n "$client_pid" ]; then kill "$client_pid" 2>/dev/null || true; fi
            cat "$RUNNER_TEMP/websocket-docker.log" 2>/dev/null || true
            docker logs "$app_name" 2>&1 || true
            docker logs "$worker_name" 2>&1 || true
            docker logs "$grpc_name" 2>&1 || true
            docker rm -f "$app_name" "$worker_name" "$grpc_name" > /dev/null 2>&1 || true
            docker volume rm "$upload_volume" > /dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cp config/config.example.yaml config/config.yaml
          chmod 600 config/config.yaml
          CGO_ENABLED=0 GOOS=linux go build -o "$RUNNER_TEMP/runtime-check" ./integration-test/runtimecheck
          docker build -f deployment/docker/Dockerfile --build-arg TARGET=app -t gobase-smoke:app .
          docker build -f deployment/docker/Dockerfile --build-arg TARGET=worker -t gobase-smoke:worker .
          docker build -f deployment/docker/Dockerfile --build-arg TARGET=grpc -t gobase-smoke:grpc .
          test "$(docker image inspect --format '{{.Config.User}}' gobase-smoke:app)" = '65532:65532'
          test "$(docker image inspect --format '{{.Config.User}}' gobase-smoke:worker)" = '65532:65532'
          test "$(docker image inspect --format '{{.Config.User}}' gobase-smoke:grpc)" = '65532:65532'
          docker volume create "$upload_volume"
          runtime_env=(--network host --mount "source=$upload_volume,target=/uploads" -e APP_ENV=development -e HTTP_PORT=18080 -e POSTGRES_HOST=localhost -e POSTGRES_DBNAME=test_db -e POSTGRES_SSLMODE=disable -e REDIS_HOST=localhost -e REDIS_DB=1 -e JWT_SECRET_KEY=integration-test-secret-key -e STORAGE_DRIVER=local -e STORAGE_LOCAL_PATH=/uploads -e WEBSOCKET_ENABLED=true -e WEBSOCKET_ALLOWED_ORIGINS=https://example.com)
          docker run -d --name "$app_name" "${runtime_env[@]}" gobase-smoke:app
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:18080/readyz > /dev/null; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          curl -fsS http://localhost:18080/healthz
          curl -fsS http://localhost:18080/swagger/doc.json | jq -e '.paths["/widgets"].post.responses["201"]'
          docker run -d --name "$grpc_name" --network host -e GRPC_ENABLED=true -e GRPC_INSECURE=true -e GRPC_ADDRESS=0.0.0.0:50051 -e JWT_SECRET_KEY=integration-test-secret-key gobase-smoke:grpc
          go run ./integration-test/grpccheck -insecure -http-url=http://localhost:18080
          docker stop --time 25 "$grpc_name"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$grpc_name")" = 0
          curl -fsS http://localhost:18080/readyz
          echo 'Docker gRPC stopped independently; HTTP remains ready'
          docker run -d --name "$worker_name" "${runtime_env[@]}" gobase-smoke:worker
          for container in "$app_name" "$worker_name"; do
            docker cp "$RUNNER_TEMP/runtime-check" "$container":/runtime-check
            docker exec "$container" /runtime-check
          done
          APP_HOST=localhost APP_PORT=18080 TEST_WORKER_ENABLED=true go test -count=1 -v ./integration-test/... -run 'TestHTTP(Register|Login|GetCurrentUser|RefreshToken|Logout|Unauthorized|CRUD|GeneratedCRUD)V1'
          email="docker-${{ matrix.engine }}@example.com"
          curl -fsS -H 'Content-Type: application/json' -d "{\"email\":\"$email\",\"password\":\"SmokeTest123!\",\"name\":\"Docker smoke\"}" http://localhost:18080/v1/auth/register | jq -e '.success == true'
          processed=false
          for attempt in $(seq 1 60); do
            if docker logs "$worker_name" 2>&1 | grep 'Email sent' | grep -q "$email"; then processed=true; break; fi
            sleep 1
          done
          test "$processed" = true
          "$RUNNER_TEMP/websocket-check" -url=http://localhost:18080 -wait-shutdown > "$RUNNER_TEMP/websocket-docker.log" 2>&1 &
          client_pid=$!
          connected=false
          for attempt in $(seq 1 10); do
            if grep -q 'WebSocket connected' "$RUNNER_TEMP/websocket-docker.log"; then connected=true; break; fi
            kill -0 "$client_pid"
            sleep 1
          done
          test "$connected" = true
          docker stop --time 25 "$app_name" "$worker_name"
          wait "$client_pid"
          client_pid=''
          grep -q 'WebSocket shutdown verified' "$RUNNER_TEMP/websocket-docker.log"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$app_name")" = 0
          test "$(docker inspect --format '{{.State.ExitCode}}' "$worker_name")" = 0
      - name: Stop app
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/grpc.pid" ] && [ ! -f "$RUNNER_TEMP/grpc.exit" ]; then
            kill "$(cat "$RUNNER_TEMP/grpc.pid")" 2>/dev/null || true
          fi
          if [ -f "$RUNNER_TEMP/grpc.log" ]; then cat "$RUNNER_TEMP/grpc.log"; fi
          if [ -f "$RUNNER_TEMP/app.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/app.pid")" 2>/dev/null || true
          fi
          if [ -f "$RUNNER_TEMP/app.log" ]; then
            cat "$RUNNER_TEMP/app.log"
          fi

  minimal:
    name: Minimal (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [gin, stdlib, fiber]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Generate and verify minimal service without infrastructure
        run: go run ./pkg/tools/verifyengines -profile=minimal -engine=${{ matrix.engine }} -output="$RUNNER_TEMP/gobase-minimal"
      - name: Lint minimal service
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: ${{ runner.temp }}/gobase-minimal/${{ matrix.engine }}
      - name: Scan minimal service
        working-directory: ${{ runner.temp }}/gobase-minimal/${{ matrix.engine }}
        run: go tool govulncheck ./...
      - name: Verify minimal Docker runtime without infrastructure
        working-directory: ${{ runner.temp }}/gobase-minimal/${{ matrix.engine }}
        run: |
          container="gobase-minimal-${{ matrix.engine }}"
          image="gobase-minimal:${{ matrix.engine }}"
          cleanup() {
            docker logs "$container" 2>&1 || true
            docker rm -f "$container" > /dev/null 2>&1 || true
          }
          trap cleanup EXIT
          CGO_ENABLED=0 GOOS=linux go build -o "$RUNNER_TEMP/minimal-runtime-check" ./integration-test/runtimecheck
          docker build -f deployment/docker/Dockerfile -t "$image" .
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = '65532:65532'
          docker run -d --name "$container" -p 18080:8080 -e APP_ENV=production "$image"
          ready=false
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:18080/readyz > /dev/null; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          curl -fsS http://localhost:18080/healthz
          code="$(curl -sS -o "$RUNNER_TEMP/minimal-error.json" -w '%{http_code}' -H 'X-Request-ID: minimal-docker' http://localhost:18080/missing)"
          test "$code" = 404
          jq -e '.success == false and .error.code == "NOT_FOUND" and .request_id == "minimal-docker"' "$RUNNER_TEMP/minimal-error.json"
          docker cp "$RUNNER_TEMP/minimal-runtime-check" "$container":/runtime-check
          docker exec "$container" /runtime-check -profile=minimal
          docker stop --time 25 "$container"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$container")" = 0
