version: 2

updates:
  # Go modules
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    groups:
      go-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      go-security-minor-and-patch:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "go"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      actions-security-minor-and-patch:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"

  # Docker
  - package-ecosystem: docker
    directory: "/deployment/docker"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 3
    groups:
      docker-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      docker-security-minor-and-patch:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "docker"
    labels:
      - "dependencies"
      - "docker"
