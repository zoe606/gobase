# Application Configuration
app:
  name: go-boilerplate
  version: 1.0.0
  env: development  # development, staging, production

# HTTP Server Configuration
http:
  port: "8080"
  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 60s
  shutdown_timeout: 15s  # Graceful shutdown timeout
  body_limit: 4194304  # 4MB in bytes

# Logging Configuration
log:
  level: debug  # debug, info, warn, error

# PostgreSQL Configuration
postgres:
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  dbname: app
  sslmode: disable
  max_pool_size: 10
  max_idle_conns: 5
  conn_max_lifetime: 1h
  conn_max_idle_time: 30m

# Metrics Configuration
metrics:
  enabled: true

# Local storage for new projects. Set driver to s3 and configure STORAGE_S3_* to use S3.
storage:
  driver: local
  local_path: ./uploads
  local_url: http://localhost:8080/uploads

# Swagger Documentation
swagger:
  enabled: true

# Rate Limiting
rate_limit:
  max: 100
  expiration: 1m
  store: memory  # "memory" (default) or "redis" (requires Redis connection)

# Background Tasks
asynq:
  concurrency: 10
  max_retry: 3
  job_timeout: 5m

# Auth email (Full profile). See docs/auth-email.md.
email:
  provider: resend  # resend or noop
  api_key: ""
  from_email: noreply@yourdomain.com
  from_name: Go Boilerplate
email_verification:
  enabled: true
  auto_verify: true  # Development only. Set false to send verification links.
  token_ttl: 24h
  base_url: http://localhost:3000
password_reset:
  token_ttl: 1h
  base_url: http://localhost:3000

# Application gRPC (Full profile)
grpc:
  enabled: false
  address: "127.0.0.1:50051"
  insecure: false
  tls_cert_file: ""
  tls_key_file: ""
  request_timeout: "5s"
  shutdown_timeout: "15s"
  connection_timeout: "5s"
  max_message_size: 65536
  max_concurrent_streams: 128

# WebSocket (Full profile)
websocket:
  enabled: false
  allowed_origins: ""
  handshake_timeout: 5s
  read_timeout: 60s
  write_timeout: 10s
  ping_interval: 25s
  max_message_size: 65536
  max_connections: 128

# JWT Configuration
jwt:
  secret_key: change-me-in-production
  access_expiry: 15m
  refresh_expiry: 168h  # 7 days
  algorithm: hs256  # hs256, rs256, or es256
  # private_key_path: /path/to/private.pem  # Required for rs256/es256
  # public_key_path: /path/to/public.pem    # Required for rs256/es256

# Distributed Lock
lock:
  provider: noop  # "noop" (single instance) or "redis" (multi-replica)

# Idempotency Middleware
idempotency:
  enabled: false
  ttl: 24h
  required_for_post: false  # Return 400 if POST lacks Idempotency-Key header
